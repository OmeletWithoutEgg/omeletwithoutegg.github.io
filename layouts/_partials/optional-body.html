<!-- Dark mode toggle button -->
<button type="button" id="dark-mode-toggle-btn" aria-label="Dark mode" aria-pressed="false" style="display:none;">
  <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path class="sun" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 17.5a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11z"></path>
    <path class="moon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
</button>
<!-- Background animation and toggle button -->
<canvas id="bganim-canvas" aria-hidden="true"></canvas>

<button type="button" id="bganim-toggle-btn" aria-label="Background animation" aria-pressed="false" style="display:none;">
  <svg aria-hidden="true" focusable="false" width="25" height="25" viewBox="0 0 200 200">
    <polygon class="hexagon" points="100,20 170,60 170,140 100,180 30,140 30,60"
                      fill="none" stroke="currentColor" stroke-width="15" />
  </svg>
</button>
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
</script>
